<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KH90 Community Store</title>
    <style>
        :root { --main-red: #ff4757; --dark-bg: #0d1117; --card-bg: #161b22; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--dark-bg); color: white; margin: 0; text-align: center; }
        
        header { background: var(--card-bg); padding: 30px; border-bottom: 3px solid var(--main-red); }
        h1 { margin: 0; color: var(--main-red); letter-spacing: 2px; }
        .tagline { color: #8b949e; font-size: 14px; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; padding: 30px; }
        
        .card { background: var(--card-bg); border-radius: 15px; padding: 20px; border: 1px solid #30363d; text-align: left; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: var(--main-red); }
        
        .app-name { font-size: 20px; font-weight: bold; margin-bottom: 5px; color: #58a6ff; }
        .dev-name { font-size: 13px; color: #8b949e; margin-bottom: 15px; }
        
        .btn-download { 
            background: var(--main-red); color: white; text-decoration: none; 
            padding: 12px; display: block; text-align: center; border-radius: 8px; 
            font-weight: bold; transition: 0.2s; 
        }
        .btn-download:hover { background: #ff6b81; }

        #loader { padding: 50px; font-size: 18px; color: #58a6ff; }
    </style>
</head>
<body>

<header>
    <h1>KH90 STORE</h1>
    <p class="tagline">Cloud Storage & Games Platform</p>
</header>

<div id="loader">🔄 ਕਲਾਊਡ ਤੋਂ ਗੇਮਾਂ ਲੋਡ ਹੋ ਰਹੀਆਂ ਹਨ...</div>
<div class="grid" id="storeGrid"></div>

<script>
    // --- ਆਪਣੀ ਸੈਟਿੰਗ ਇੱਥੇ ਭਰੋ ---
    const REPO_OWNER = "ਤੁਹਾਡਾ_GITHUB_USERNAME"; // ਉਦਾਹਰਨ: kh90-dev
    const REPO_NAME = "kh90-store";          // ਤੁਹਾਡੀ ਰੈਪੋ ਦਾ ਨਾਮ
    const FILE_PATH = "database.json";        // ਡਾਟਾ ਵਾਲੀ ਫਾਈਲ

    async function fetchApps() {
        const grid = document.getElementById('storeGrid');
        const loader = document.getElementById('loader');
        
        // GitHub API ਤੋਂ ਡਾਟਾ ਲੈਣਾ
        const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;

        try {
            const response = await fetch(url);
            const data = await response.json();
            
            // GitHub ਦਾ ਡਾਟਾ Base64 ਵਿੱਚ ਹੁੰਦਾ ਹੈ, ਉਸਨੂੰ ਪੜ੍ਹਨਯੋਗ ਬਣਾਉਣਾ (Decode)
            const apps = JSON.parse(decodeURIComponent(escape(atob(data.content))));

            loader.style.display = "none";
            grid.innerHTML = "";

            // ਨਵੀਆਂ ਐਪਸ ਪਹਿਲਾਂ ਦਿਖਾਉਣ ਲਈ (Reverse)
            apps.reverse().forEach(app => {
                const card = `
                    <div class="card">
                        <div class="app-name">${app.name}</div>
                        <div class="dev-name">By: ${app.dev || "Unknown"}</div>
                        <div style="font-size: 11px; color: #8b949e; margin-bottom: 10px;">Published: ${app.date || "N/A"}</div>
                        <a href="${app.url}" target="_blank" class="btn-download">DOWNLOAD (1GB+)</a>
                    </div>
                `;
                grid.innerHTML += card;
            });

            if(apps.length === 0) {
                loader.innerText = "ਅਜੇ ਸਟੋਰ ਵਿੱਚ ਕੋਈ ਗੇਮ ਨਹੀਂ ਹੈ।";
            }

        } catch (error) {
            console.error("Error:", error);
            loader.innerText = "❌ ਡਾਟਾ ਲੋਡ ਨਹੀਂ ਹੋ ਸਕਿਆ। GitHub ਸੈਟਿੰਗ ਚੈੱਕ ਕਰੋ।";
        }
    }

    // ਪੇਜ ਖੁੱਲ੍ਹਦੇ ਹੀ ਗੇਮਾਂ ਲੋਡ ਕਰੋ
    window.onload = fetchApps;
</script>

</body>
</html>
