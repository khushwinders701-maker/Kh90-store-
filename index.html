<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <title>KH90 | File Upload Console</title>
    <style>
        body { font-family: sans-serif; background: #0d1117; color: white; padding: 20px; text-align: center; }
        .box { background: #161b22; padding: 30px; border-radius: 15px; max-width: 450px; margin: auto; border: 1px solid #30363d; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #010409; border: 1px solid #30363d; color: white; border-radius: 8px; box-sizing: border-box; }
        .file-label { display: block; text-align: left; margin-top: 10px; font-size: 14px; color: #8b949e; }
        button { background: #238636; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        #status { margin-top: 15px; font-size: 14px; color: #58a6ff; }
    </style>
</head>
<body>

<div class="box">
    <h2>🚀 KH90 Upload Console</h2>
    
    <input type="text" id="appName" placeholder="ਐਪ ਦਾ ਨਾਮ">
    
    <label class="file-label">ਫਾਈਲ ਚੁਣੋ (Choose APK or Image):</label>
    <input type="file" id="fileInput">
    
    <p style="font-size: 12px; color: #8b949e;">ਜਾਂ ਸਿੱਧਾ ਲਿੰਕ ਪਾਓ:</p>
    <input type="text" id="appLink" placeholder="File Link (1GB+)">

    <button onclick="handleUpload()">PUBLISH TO STORE</button>
    <div id="status">Ready</div>
</div>

<script>
    const GITHUB_TOKEN = "ਤੁਹਾਡਾ_TOKEN";
    const REPO_OWNER = "ਤੁਹਾਡਾ_USERNAME";
    const REPO_NAME = "kh90-store";
    const DB_PATH = "database.json";

    async function handleUpload() {
        const fileBtn = document.getElementById('fileInput');
        const appName = document.getElementById('appName').value;
        const manualLink = document.getElementById('appLink').value;
        const status = document.getElementById('status');

        if (!appName) return alert("ਨਾਮ ਭਰੋ!");

        let finalLink = manualLink;

        // ਜੇਕਰ ਯੂਜ਼ਰ ਨੇ ਫਾਈਲ ਚੁਣੀ ਹੈ
        if (fileBtn.files.length > 0) {
            status.innerText = "⏳ ਫਾਈਲ GitHub 'ਤੇ ਅਪਲੋਡ ਹੋ ਰਹੀ ਹੈ...";
            const file = fileBtn.files[0];
            finalLink = await uploadFileToGithub(file);
        }

        if (!finalLink) {
            status.innerText = "❌ ਲਿੰਕ ਨਹੀਂ ਮਿਲਿਆ!";
            return;
        }

        // ਸਟੋਰ ਦੇ ਡਾਟਾਬੇਸ (JSON) ਨੂੰ ਅਪਡੇਟ ਕਰਨਾ
        await updateDatabase(appName, finalLink);
    }

    // ਫਾਈਲ ਨੂੰ ਸਿੱਧਾ GitHub ਰੈਪੋ ਵਿੱਚ ਅਪਲੋਡ ਕਰਨ ਵਾਲਾ ਫੰਕਸ਼ਨ
    async function uploadFileToGithub(file) {
        const reader = new FileReader();
        return new Promise((resolve, reject) => {
            reader.onload = async () => {
                const content = reader.result.split(',')[1]; // Base64 content
                const fileName = `uploads/${Date.now()}_${file.name}`;
                const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${fileName}`;

                const res = await fetch(url, {
                    method: "PUT",
                    headers: { "Authorization": `token ${GITHUB_TOKEN}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        message: `Uploaded ${file.name}`,
                        content: content
                    })
                });

                if (res.ok) {
                    const data = await res.json();
                    resolve(data.content.download_url); // ਸਿੱਧਾ ਡਾਊਨਲੋਡ ਲਿੰਕ ਮਿਲ ਜਾਵੇਗਾ
                } else {
                    alert("ਫਾਈਲ ਅਪਲੋਡ ਫੇਲ! (ਸ਼ਾਇਦ ਫਾਈਲ ਬਹੁਤ ਵੱਡੀ ਹੈ)");
                    resolve(null);
                }
            };
            reader.readAsDataURL(file);
        });
    }

    async function updateDatabase(name, link) {
        const status = document.getElementById('status');
        status.innerText = "⏳ ਸਟੋਰ ਅਪਡੇਟ ਹੋ ਰਿਹਾ ਹੈ...";
        
        // (ਇੱਥੇ ਪੁਰਾਣਾ JSON ਅਪਡੇਟ ਵਾਲਾ ਕੋਡ ਆਵੇਗਾ...)
        // ਮੈਂ ਪਹਿਲਾਂ ਵਾਲੇ ਕੋਡ ਵਾਂਗ ਹੀ ਡਾਟਾ ਸੇਵ ਕਰਨਾ ਹੈ
        status.innerHTML = "✅ ਸਫਲਤਾਪੂਰਵਕ ਪਬਲਿਸ਼ ਹੋ ਗਿਆ!";
    }
</script>
</body>
</html>
