<!DOCTYPE html>
<html lang="pa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KH90 Store</title>
    <style>
        /* ਬਿਲਕੁਲ ਹਲਕਾ ਡਿਜ਼ਾਈਨ */
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #1f1f1f;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #00ff88;
        }
        h1 {
            margin: 0;
            font-size: 22px;
            color: #00ff88;
        }
        
        /* ਸਰਚ ਬਾਰ ਦਾ ਡਿਜ਼ਾਈਨ */
        .search-container {
            text-align: center;
            padding: 20px 10px 0 10px;
        }
        #searchInput {
            padding: 12px 20px;
            width: 80%;
            max-width: 400px;
            border-radius: 25px;
            border: 2px solid #333;
            background-color: #1f1f1f;
            color: white;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        #searchInput:focus {
            border-color: #00ff88;
        }

        /* ਐਪਸ ਨੂੰ ਲਾਈਨ ਵਿੱਚ ਲਗਾਉਣ ਲਈ ਗ੍ਰਿਡ */
        .app-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            padding: 20px;
        }
        .app-card {
            background-color: #1f1f1f;
            width: 130px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .app-icon {
            width: 70px;
            height: 70px;
            border-radius: 15px;
            margin: 0 auto 10px auto;
            background-color: #333;
        }
        .app-title {
            font-size: 14px;
            margin-bottom: 10px;
            height: 35px;
            overflow: hidden;
        }
        .download-btn {
            background-color: #00ff88;
            color: #000;
            border: none;
            padding: 8px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .download-btn:active {
            background-color: #00cc6a;
        }
        .status-msg {
            text-align: center;
            font-size: 16px;
            color: #00ff88;
            width: 100%;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>KH90 Store</h1>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="ਐਪਸ ਅਤੇ ਗੇਮਾਂ ਲੱਭੋ..." onkeyup="searchApps()">
    </div>

    <div class="app-container" id="apps-list">
        <div class="status-msg" id="loading-status">ਐਪਸ ਲੋਡ ਹੋ ਰਹੀਆਂ ਹਨ...</div>
    </div>

    <script>
        function searchApps() {
            // ਸਰਚ ਬਾਕਸ ਵਿੱਚ ਲਿਖਿਆ ਟੈਕਸਟ ਪ੍ਰਾਪਤ ਕਰੋ
            let input = document.getElementById('searchInput').value.toLowerCase();
            // ਸਾਰੇ ਐਪ ਕਾਰਡ ਪ੍ਰਾਪਤ ਕਰੋ
            let cards = document.getElementsByClassName('app-card');

            // ਹਰ ਇੱਕ ਕਾਰਡ ਨੂੰ ਚੈੱਕ ਕਰੋ
            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].querySelector('.app-title').innerText.toLowerCase();
                
                // ਜੇਕਰ ਟੈਕਸਟ ਮੇਲ ਖਾਂਦਾ ਹੈ ਤਾਂ ਕਾਰਡ ਦਿਖਾਓ, ਨਹੀਂ ਤਾਂ ਛੁਪਾ ਦਿਓ
                if (title.includes(input)) {
                    cards[i].style.display = "";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
    </script>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
      import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-analytics.js";
      import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyAyFSQJSx7SsFYTbfRAEuNxWfeO2jTmv6Q",
        authDomain: "my-store1-1093c.firebaseapp.com",
        projectId: "my-store1-1093c",
        storageBucket: "my-store1-1093c.firebasestorage.app",
        messagingSenderId: "1095213665187",
        appId: "1:1095213665187:web:653cd17020c533583ca816",
        measurementId: "G-01QMD8PT02"
      };

      const app = initializeApp(firebaseConfig);
      const analytics = getAnalytics(app);
      const db = getFirestore(app);

      async function loadAppsFromFirebase() {
          const appsListDiv = document.getElementById('apps-list');
          const loadingStatus = document.getElementById('loading-status');
          
          try {
              const querySnapshot = await getDocs(collection(db, "apps"));
              
              if (loadingStatus) loadingStatus.remove();

              if (querySnapshot.empty) {
                  appsListDiv.innerHTML = "<div class='status-msg'>ਕੋਈ ਐਪ ਨਹੀਂ ਮਿਲੀ। ਫਾਇਰਬੇਸ ਵਿੱਚ 'apps' ਕਲੈਕਸ਼ਨ ਬਣਾਓ।</div>";
                  return;
              }

              querySnapshot.forEach((doc) => {
                  const appData = doc.data();
                  const appCard = document.createElement('div');
                  appCard.className = 'app-card';
                  
                  appCard.innerHTML = `
                      <div class="app-icon" style="background-color: ${appData.iconColor || '#00ff88'};"></div>
                      <div class="app-title">${appData.name || 'Unnamed App'}</div>
                      <button class="download-btn" onclick="window.open('${appData.downloadUrl || '#'}', '_blank')">Install</button>
                  `;
                  
                  appsListDiv.appendChild(appCard);
              });
          } catch (error) {
              console.error("Error fetching apps: ", error);
              appsListDiv.innerHTML = "<div class='status-msg' style='color: red;'>ਐਪਸ ਲੋਡ ਕਰਨ ਵਿੱਚ ਕੋਈ ਸਮੱਸਿਆ ਆਈ ਹੈ।</div>";
          }
      }

      loadAppsFromFirebase();
    </script>

</body>
</html>
